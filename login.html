<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendaris</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center; max-width: 360px; }
    h1 { margin-top: 0; }
    p { color: #555; }
    a.btn { display: inline-block; margin-top: 1rem; padding: .75rem 1.5rem; background: #1a73e8; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; }
    a.btn:hover { background: #1557b0; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Calendaris</h1>
    <p>Entra amb el teu compte de Google (Gmail o de l'empresa) per veure els teus calendaris.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <a class="btn" href="{{ url_for('login') }}">Entra amb Google</a>
  </div>
</body>
</html>
