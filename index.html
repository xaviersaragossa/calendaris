<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Els meus calendaris</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#222; --muted:#666; --line:#eee; --accent:#1a73e8; --soft:#eef3fd; --err:#b00020; --errbg:#fdecea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --card:#1f2227; --text:#e8eaed; --muted:#9aa0a6; --line:#2c3036; --accent:#8ab4f8; --soft:#26303f; --err:#f28b82; --errbg:#3b2220; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--card); padding:1rem 1.5rem; display:flex; flex-wrap:wrap; gap:.75rem; justify-content:space-between; align-items:center; box-shadow:0 1px 4px rgba(0,0,0,.1); }
  h1 { margin:0; font-size:1.25rem; }
  h2 { margin:0 0 .75rem; font-size:1.05rem; }
  .hdr-right { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
  .muted { color:var(--muted); } .small { font-size:.85rem; }
  button, select { font:inherit; font-size:.9rem; border-radius:8px; border:0; padding:.5rem 1rem; cursor:pointer; background:var(--accent); color:#fff; }
  button.sec { background:var(--soft); color:var(--accent); }
  select { background:var(--soft); color:var(--accent); padding:.4rem .6rem; }
  [hidden] { display:none !important; }
  .card { background:var(--card); border-radius:12px; padding:1.25rem; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  .center { max-width:420px; margin:3rem auto; text-align:center; }
  #msg { margin:1rem 1.5rem 0; }
  #msg div { padding:.75rem 1rem; border-radius:8px; background:var(--soft); }
  #msg div.error { background:var(--errbg); color:var(--err); }
  main { display:grid; grid-template-columns:240px 1fr; gap:1.25rem; padding:1.25rem 1.5rem; align-items:start; }
  @media (max-width:700px) { main { grid-template-columns:1fr; padding:1rem; } }
  ul { list-style:none; margin:0; padding:0; }
  .cal label { display:flex; gap:.6rem; align-items:center; padding:.4rem 0; cursor:pointer; }
  .dot { width:12px; height:12px; border-radius:50%; flex:none; }
  .head { display:flex; justify-content:space-between; align-items:center; gap:1rem; }
  .day { margin:1.25rem 0 .25rem; font-weight:700; text-transform:capitalize; }
  .ev { display:flex; gap:.75rem; padding:.6rem 0; border-bottom:1px solid var(--line); }
  .ev:last-child { border-bottom:0; }
  .bar { width:4px; border-radius:2px; flex:none; }
  .when { min-width:7.5rem; color:var(--muted); font-size:.9rem; }
  .title { font-weight:600; }
  .meta { color:var(--muted); font-size:.85rem; }
  a { color:var(--accent); text-decoration:none; }
  .tools { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
  .seg { display:inline-flex; }
  .seg button { border-radius:0; background:var(--soft); color:var(--accent); }
  .seg button:first-child { border-radius:8px 0 0 8px; }
  .seg button:last-child { border-radius:0 8px 8px 0; }
  .seg button.on { background:var(--accent); color:#fff; }
  .gridwrap { overflow-x:auto; margin-top:.5rem; }
  .cal-grid { display:grid; grid-template-columns:repeat(7, minmax(110px, 1fr)); min-width:770px; border-top:1px solid var(--line); border-left:1px solid var(--line); }
  .dow { padding:.4rem; font-weight:700; font-size:.8rem; color:var(--muted); text-align:center; text-transform:capitalize; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  .cell { min-height:110px; padding:.3rem; overflow:hidden; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  .cell.today { background:var(--soft); }
  .dn { font-size:.8rem; color:var(--muted); margin-bottom:.2rem; }
  .cell.today .dn { color:var(--accent); font-weight:700; }
  .chip { display:block; font-size:.75rem; padding:.1rem .35rem; margin-bottom:2px; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .more { font-size:.75rem; color:var(--accent); background:none; border:0; padding:0; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Els meus calendaris</h1>
  <div class="hdr-right">
    <span id="who" class="muted small"></span>
    <button id="btn-refresh" class="sec" hidden>Actualitza</button>
    <button id="btn-switch" class="sec" hidden>Canvia de compte</button>
    <button id="btn-out" class="sec" hidden>Sortir</button>
  </div>
</header>

<div id="msg" role="status"></div>

<section id="login" class="card center">
  <p>Entra amb el teu compte de Google per veure els propers esdeveniments dels teus calendaris.</p>
  <button id="btn-in">Entra amb Google</button>
  <p class="muted small">Només lectura. Les dades es carreguen directament al teu navegador; aquesta pàgina no té servidor ni desa res.</p>
</section>

<main id="app" hidden>
  <aside class="card">
    <h2>Calendaris</h2>
    <ul id="cals"></ul>
  </aside>
  <section class="card">
    <div class="head">
      <h2 id="ev-title">Propers esdeveniments</h2>
      <div class="tools">
        <div class="seg">
          <button id="v-grid" class="on">5 setmanes</button>
          <button id="v-list">Llista</button>
        </div>
        <span id="nav" class="tools">
          <button id="nav-prev" class="sec" aria-label="Setmana anterior">◀</button>
          <button id="nav-today" class="sec">Avui</button>
          <button id="nav-next" class="sec" aria-label="Setmana següent">▶</button>
        </span>
        <select id="days" hidden aria-label="Interval de dies">
          <option value="7">7 dies</option>
          <option value="14" selected>14 dies</option>
          <option value="30">30 dies</option>
        </select>
      </div>
    </div>
    <div id="events"></div>
  </section>
</main>

<script>
  // ====== CONFIGURACIÓ: enganxa aquí el teu ID de client de Google Cloud ======
  // (L'ID de client no és secret. Mai no hi posis el "secret de client".)
  const CLIENT_ID = "419710279198-q9va8acipt65pbiifm7ppulofh5q326e.apps.googleusercontent.com";
  // ============================================================================

  const SCOPE = "https://www.googleapis.com/auth/calendar.readonly";
  const API = "https://www.googleapis.com/calendar/v3";
  const $ = (s) => document.querySelector(s);

  let tokenClient = null, token = null, calendars = [], events = [];
  let view = "grid", weekOffset = 0, gridStart = null;
  const hidden = new Set(), expanded = new Set();

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeColor = (c) => (/^#[0-9a-f]{6}$/i.test(c || "") ? c : "#888888");

  function showMsg(text, kind) {
    $("#msg").innerHTML = text ? `<div class="${kind || ""}">${esc(text)}</div>` : "";
  }

  function setSignedIn(on) {
    $("#login").hidden = on;
    $("#app").hidden = !on;
    for (const id of ["#btn-refresh", "#btn-switch", "#btn-out"]) $(id).hidden = !on;
    if (!on) $("#who").textContent = "";
  }

  function init() {
    if (CLIENT_ID.startsWith("EL-TEU")) {
      showMsg("Falta configurar el CLIENT_ID al principi del fitxer index.html.", "error");
      return;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPE,
      callback: onToken,
      error_callback: (e) => showMsg("No s'ha pogut iniciar la sessió (" + (e.type || "error") + ").", "error"),
    });
  }

  function signIn(prompt) {
    if (!tokenClient) return init();
    tokenClient.requestAccessToken({ prompt });
  }

  function onToken(resp) {
    if (resp.error) return showMsg("Google ha retornat un error: " + resp.error, "error");
    if (!google.accounts.oauth2.hasGrantedAllScopes(resp, SCOPE)) {
      return showMsg("Cal acceptar el permís de lectura dels calendaris per poder continuar.", "error");
    }
    token = resp.access_token;
    setSignedIn(true);
    load();
  }

  function signOut() {
    if (token) google.accounts.oauth2.revoke(token, () => {});
    token = null; calendars = []; events = []; hidden.clear(); expanded.clear(); weekOffset = 0;
    showMsg("");
    setSignedIn(false);
  }

  async function api(path, params) {
    const url = API + path + (params ? "?" + new URLSearchParams(params) : "");
    const r = await fetch(url, { headers: { Authorization: "Bearer " + token } });
    if (r.status === 401) { signOut(); throw new Error("La sessió ha caducat. Torna a entrar."); }
    if (!r.ok) {
      let m = "Error " + r.status;
      try { m = (await r.json()).error.message || m; } catch (_) {}
      throw new Error(m);
    }
    return r.json();
  }

  const startMs = (e) => (e.start.dateTime ? Date.parse(e.start.dateTime) : Date.parse(e.start.date + "T00:00:00"));

  async function load() {
    showMsg("Carregant…");
    try {
      const list = await api("/users/me/calendarList", { maxResults: 250 });
      const primary = list.items.find((c) => c.primary);
      if (primary) $("#who").textContent = primary.id;

      // Només els calendaris "activats" (marcats com a visibles a Google Calendar)
      calendars = list.items.filter((c) => c.selected);

      let min, max;
      if (view === "grid") {
        gridStart = weekStart(weekOffset);
        min = gridStart; max = addDays(gridStart, 35);
      } else {
        min = new Date(); max = new Date(Date.now() + (+$("#days").value) * 864e5);
      }
      const params = {
        timeMin: min.toISOString(), timeMax: max.toISOString(),
        singleEvents: "true", orderBy: "startTime", maxResults: view === "grid" ? "250" : "100",
      };
      let failed = 0;
      const results = await Promise.all(calendars.map((c) =>
        api(`/calendars/${encodeURIComponent(c.id)}/events`, params)
          .then((r) => (r.items || []).filter((e) => e.status !== "cancelled").map((e) => ({ ...e, _cal: c })))
          .catch(() => { failed++; return []; })
      ));
      events = results.flat().sort((a, b) => startMs(a) - startMs(b));
      render();
      showMsg(failed ? `No s'han pogut carregar ${failed} calendari(s).` : "", failed ? "error" : "");
    } catch (err) {
      showMsg(err.message, "error");
    }
  }

  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const midnight = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const parseDay = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const weekStart = (offset) => { const t = midnight(new Date()); return addDays(t, -((t.getDay() + 6) % 7) + 7 * offset); };

  function textOn(hex) {
    const n = parseInt(hex.slice(1), 16), r = n >> 16, gr = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * gr + 0.114 * b) > 160 ? "#202124" : "#ffffff";
  }

  // Primer i últim dia (a mitjanit, hora local) que cobreix un esdeveniment
  function daySpan(e) {
    if (e.start.dateTime) {
      const s = new Date(e.start.dateTime), en = new Date(new Date(e.end.dateTime).getTime() - 1);
      return [midnight(s), midnight(en < s ? s : en)];
    }
    const s = parseDay(e.start.date), en = addDays(parseDay(e.end.date), -1);
    return [s, en < s ? s : en];
  }

  function gridTitle() {
    if (!gridStart) return "Propers esdeveniments";
    const last = addDays(gridStart, 34);
    const f = (d) => d.toLocaleDateString("ca", { day: "numeric", month: "short" });
    return f(gridStart) + " – " + f(last) + " " + last.getFullYear();
  }

  function gridHTML() {
    if (!gridStart) return "";
    const hm = (iso) => new Date(iso).toLocaleTimeString("ca", { hour: "2-digit", minute: "2-digit" });
    const visible = events.filter((e) => !hidden.has(e._cal.id)).map((e) => ({ e, span: daySpan(e) }));
    const todayT = midnight(new Date()).getTime();

    let html = '<div class="gridwrap"><div class="cal-grid">';
    for (let i = 0; i < 7; i++) {
      html += `<div class="dow">${esc(addDays(gridStart, i).toLocaleDateString("ca", { weekday: "short" }))}</div>`;
    }
    for (let i = 0; i < 35; i++) {
      const day = addDays(gridStart, i), t = day.getTime();
      const list = visible
        .filter((x) => x.span[0].getTime() <= t && t <= x.span[1].getTime())
        .sort((a, b) => (a.e.start.dateTime ? 1 : 0) - (b.e.start.dateTime ? 1 : 0) || startMs(a.e) - startMs(b.e));
      const key = String(t), open = expanded.has(key), shown = open ? list : list.slice(0, 3);
      const label = (i === 0 || day.getDate() === 1)
        ? day.toLocaleDateString("ca", { day: "numeric", month: "short" }) : String(day.getDate());

      html += `<div class="cell${t === todayT ? " today" : ""}"><div class="dn">${esc(label)}</div>`;
      for (const { e, span } of shown) {
        const col = safeColor(e._cal.backgroundColor);
        const time = e.start.dateTime && span[0].getTime() === t ? hm(e.start.dateTime) + " " : "";
        const name = e.summary || "(sense títol)";
        const tip = time + name + " · " + (e._cal.summaryOverride || e._cal.summary);
        html += `<span class="chip" style="background:${col};color:${textOn(col)}" title="${esc(tip)}">${esc(time + name)}</span>`;
      }
      if (list.length > 3) {
        html += `<button class="more" data-day="${key}">${open ? "mostra menys" : "+" + (list.length - 3) + " més"}</button>`;
      }
      html += "</div>";
    }
    return html + "</div></div>";
  }

  function render() {
    $("#cals").innerHTML = calendars.map((c, i) => `
      <li class="cal"><label>
        <input type="checkbox" data-i="${i}" ${hidden.has(c.id) ? "" : "checked"}>
        <span class="dot" style="background:${safeColor(c.backgroundColor)}"></span>
        <span>${esc(c.summaryOverride || c.summary)}</span>
      </label></li>`).join("") || '<li class="muted">No tens cap calendari activat.</li>';

    $("#ev-title").textContent = view === "grid" ? gridTitle() : "Propers esdeveniments";
    if (view === "grid") { $("#events").innerHTML = gridHTML(); return; }

    const today = new Date(); today.setHours(0, 0, 0, 0);
    const dayKey = (ms) => { const d = new Date(Math.max(ms, today.getTime())); d.setHours(0, 0, 0, 0); return d.getTime(); };
    const dayLabel = (k) => {
      const diff = Math.round((k - today.getTime()) / 864e5);
      const txt = new Date(k).toLocaleDateString("ca", { weekday: "long", day: "numeric", month: "long" });
      return diff === 0 ? "Avui · " + txt : diff === 1 ? "Demà · " + txt : txt;
    };
    const hm = (iso) => new Date(iso).toLocaleTimeString("ca", { hour: "2-digit", minute: "2-digit" });

    const visible = events.filter((e) => !hidden.has(e._cal.id));
    let html = "", last = null;
    for (const e of visible) {
      const k = dayKey(startMs(e));
      if (k !== last) { html += `<div class="day">${esc(dayLabel(k))}</div>`; last = k; }
      const when = e.start.dateTime ? `${hm(e.start.dateTime)} – ${hm(e.end.dateTime)}` : "Tot el dia";
      const link = (e.htmlLink || "").startsWith("https://www.google.com/calendar")
        ? ` · <a href="${esc(e.htmlLink)}" target="_blank" rel="noopener">Obre</a>` : "";
      html += `<div class="ev">
        <span class="bar" style="background:${safeColor(e._cal.backgroundColor)}"></span>
        <span class="when">${esc(when)}</span>
        <div><div class="title">${esc(e.summary || "(sense títol)")}</div>
        <div class="meta">${esc(e._cal.summaryOverride || e._cal.summary)}${e.location ? " · " + esc(e.location) : ""}${link}</div></div>
      </div>`;
    }
    $("#events").innerHTML = html || '<p class="muted">No hi ha esdeveniments en aquest interval.</p>';
  }

  $("#btn-in").onclick = () => signIn("");
  $("#btn-refresh").onclick = load;
  $("#btn-switch").onclick = () => { if (token) google.accounts.oauth2.revoke(token, () => {}); signIn("select_account"); };
  $("#btn-out").onclick = signOut;
  $("#days").onchange = load;

  function setView(v) {
    view = v;
    $("#v-grid").classList.toggle("on", v === "grid");
    $("#v-list").classList.toggle("on", v === "list");
    $("#nav").hidden = v !== "grid";
    $("#days").hidden = v !== "list";
    if (token) load();
  }
  $("#v-grid").onclick = () => setView("grid");
  $("#v-list").onclick = () => setView("list");
  $("#nav-prev").onclick = () => { weekOffset--; load(); };
  $("#nav-next").onclick = () => { weekOffset++; load(); };
  $("#nav-today").onclick = () => { weekOffset = 0; load(); };
  $("#events").onclick = (ev) => {
    const k = ev.target.dataset && ev.target.dataset.day;
    if (!k) return;
    expanded.has(k) ? expanded.delete(k) : expanded.add(k);
    render();
  };
  $("#cals").onchange = (ev) => {
    const c = calendars[+ev.target.dataset.i];
    if (!c) return;
    ev.target.checked ? hidden.delete(c.id) : hidden.add(c.id);
    render();
  };
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="init()"></script>
</body>
</html>
